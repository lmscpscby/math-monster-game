name = "math-monster-pvp-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One Durable Object per room code. SQLite-backed classes are what
# current Wrangler accepts for a new migration; this relay keeps the
# two seats in memory for the life of the sockets and does not write rows.
[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomRelay" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomRelay"]
